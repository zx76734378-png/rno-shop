version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flamingo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flamingo
      POSTGRES_PASSWORD: flamingo_dev
      POSTGRES_DB: flamingo_estate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flamingo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
